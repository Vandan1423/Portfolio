<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Vandan Nagori's Portfolio</title>
    <meta name="title" content="Vandan Nagori - Full Stack Developer & Software Engineer" />
    <meta name="description" content="Explore Vandan's 3D interactive portfolio showcasing full-stack development projects, experience, and technical skills in React, Node.js, Three.js, and more." />
    <meta name="keywords" content="Vandan Nagori, Full Stack Developer, Software Engineer, React, Node.js, Three.js, 3D Portfolio, Web Developer" />
    <meta name="author" content="Vandan Nagori" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vandannagori.com/" />
    <meta property="og:title" content="Vandan Nagori - Full Stack Developer & Software Engineer" />
    <meta property="og:description" content="Explore Vandan's 3D interactive portfolio showcasing full-stack development projects, experience, and technical skills." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vandannagori.com/" />
    <meta property="twitter:title" content="Vandan Nagori - Full Stack Developer & Software Engineer" />
    <meta property="twitter:description" content="Explore Vandan's 3D interactive portfolio showcasing full-stack development projects, experience, and technical skills." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- Preload critical textures for instant cockpit and planet backgrounds -->
    <!-- Cube map textures (used in SpaceCubeMap for cockpit scene) -->
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star1.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star2.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star3.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star4.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star5.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star6.jpeg" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Instant loader to prevent white screen while React loads -->
    <style>
      #instant-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #instant-loader.hidden {
        display: none;
      }
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(59, 130, 246, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loader-text {
        margin-top: 20px;
        color: #94a3b8;
        font-size: 14px;
        letter-spacing: 1px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div id="instant-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">INITIALIZING PORTFOLIO...</div>
    </div>
    
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide instant loader once React takes over (after a brief delay)
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loader = document.getElementById('instant-loader');
          if (loader) loader.classList.add('hidden');
        }, 500);
      });
    </script>
  </body>
</html>
