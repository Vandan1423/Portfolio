<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags (the %PROFILE_*% values come from src/data/profile.js, see vite.config.js) -->
    <title>%PROFILE_TITLE%</title>
    <meta name="title" content="%PROFILE_TITLE%" />
    <meta name="description" content="%PROFILE_DESCRIPTION%" />
    <meta name="keywords" content="%PROFILE_KEYWORDS%" />
    <meta name="author" content="%PROFILE_NAME%" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%PROFILE_URL%" />
    <meta property="og:title" content="%PROFILE_TITLE%" />
    <meta property="og:description" content="%PROFILE_DESCRIPTION%" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="%PROFILE_URL%" />
    <meta property="twitter:title" content="%PROFILE_TITLE%" />
    <meta property="twitter:description" content="%PROFILE_DESCRIPTION%" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0e0f11" />

    <!-- Preload critical textures for instant cockpit and planet backgrounds -->
    <!-- Cube map textures (used in SpaceCubeMap for cockpit scene) -->
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star1.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star2.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star3.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star4.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star5.jpeg" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/SpaceCubeMap/Star6.jpeg" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Instant loader to prevent a white screen while React loads. Colours match src/styles/tokens.css. -->
    <style>
      #instant-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #0e0f11;
        color: #8a857d;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #instant-loader.hidden {
        display: none;
      }
    </style>
    <div id="instant-loader">Loading…</div>
    
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide instant loader once React takes over (after a brief delay)
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loader = document.getElementById('instant-loader');
          if (loader) loader.classList.add('hidden');
        }, 500);
      });
    </script>
  </body>
</html>
